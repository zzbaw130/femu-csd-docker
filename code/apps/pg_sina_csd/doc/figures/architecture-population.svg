<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1830" viewBox="0 0 1800 1830"><rect width="100%" height="100%" fill="white"/><defs><marker id="a3268aa" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#3268aa"/></marker><marker id="a28866a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#28866a"/></marker><marker id="ab76a20" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b76a20"/></marker><marker id="a778291" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#778291"/></marker><marker id="a8453a2" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8453a2"/></marker></defs><rect x="30" y="125" width="1740" height="245" rx="12" fill="#f3f9f5" stroke="#d7dfe8"/><rect x="30" y="410" width="1740" height="235" rx="12" fill="#eef7f2" stroke="#d7dfe8"/><rect x="30" y="735" width="1740" height="245" rx="12" fill="#fffaf0" stroke="#d7dfe8"/><rect x="30" y="1020" width="1740" height="175" rx="12" fill="#f8f4fc" stroke="#d7dfe8"/><rect x="30" y="1240" width="1740" height="200" rx="12" fill="#f6f7fa" stroke="#d7dfe8"/><polyline points="560,247.5 630,247.5" fill="none" stroke="#28866a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a28866a)"/><polyline points="950,247.5 1030,247.5" fill="none" stroke="#28866a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a28866a)"/><polyline points="1132,310 1132,390 410,390 410,470" fill="none" stroke="#28866a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a28866a)"/><polyline points="1268,310 1268,390 1180,390 1180,470" fill="none" stroke="#28866a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a28866a)"/><polyline points="560,527.5 630,527.5" fill="none" stroke="#28866a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a28866a)"/><polyline points="1330,527.5 1400,527.5" fill="none" stroke="#28866a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a28866a)"/><polyline points="710,585 710,721 410,721 410,790" fill="none" stroke="#28866a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a28866a)"/><polyline points="780,585 780,790" fill="none" stroke="#28866a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a28866a)"/><polyline points="1480,585 1480,721 1180,721 1180,790" fill="none" stroke="#28866a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a28866a)"/><polyline points="1560,585 1560,790" fill="none" stroke="#28866a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a28866a)"/><polyline points="410,915 410,1070" fill="none" stroke="#28866a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a28866a)"/><polyline points="780,915 780,1070" fill="none" stroke="#28866a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a28866a)"/><polyline points="1180,915 1180,1070" fill="none" stroke="#28866a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a28866a)"/><polyline points="1560,915 1560,1070" fill="none" stroke="#28866a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a28866a)"/><polyline points="410,1150 410,1212 398,1212 398,1290" fill="none" stroke="#28866a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a28866a)"/><polyline points="780,1150 780,1212 529.1,1212 529.1,1290" fill="none" stroke="#28866a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a28866a)"/><polyline points="1180,1150 1180,1212 660.2,1212 660.2,1290" fill="none" stroke="#28866a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a28866a)"/><polyline points="1560,1150 1560,1212 791.3,1212 791.3000000000001,1290" fill="none" stroke="#28866a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a28866a)"/><polyline points="1720,954.5 1750,954.5 1750,1345 1720,1345" fill="none" stroke="#b76a20" stroke-width="2" stroke-linejoin="round" marker-end="url(#ab76a20)"/><polyline points="674,1400 674,1460 805,1460 805,1490" fill="none" stroke="#28866a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a28866a)"/><polyline points="1306,1400 1306,1460 1155,1460 1155,1490" fill="none" stroke="#b76a20" stroke-width="2" stroke-linejoin="round" marker-end="url(#ab76a20)"/><rect x="260" y="185" width="300" height="125" rx="8" fill="#f2f4f7" stroke="#a3adba" stroke-width="1.5"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="15.5" fill="#233448" text-anchor="middle"><tspan x="410" y="230.76000000000002">只读 FDM 输入</tspan><tspan x="410" y="252.77">CU 与 DMA 共用原始页</tspan><tspan x="410" y="274.78000000000003">不复制一份设备中转块</tspan></text><rect x="630" y="185" width="320" height="125" rx="8" fill="#ecf6f0" stroke="#8bb9a0" stroke-width="1.5"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="15.5" fill="#233448" text-anchor="middle"><tspan x="790" y="230.76000000000002">128 项任务元数据</tspan><tspan x="790" y="252.77">AFDM 引用 / LBA / 偏移</tspan><tspan x="790" y="274.78000000000003">输入区间及 DMA 状态</tspan></text><rect x="1030" y="185" width="340" height="125" rx="8" fill="#ecf6f0" stroke="#8bb9a0" stroke-width="1.5"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="15.5" fill="#233448" text-anchor="middle"><tspan x="1200" y="230.76000000000002">FTL 派发</tspan><tspan x="1200" y="252.77">优先选择所属槽组有空位者</tspan><tspan x="1200" y="274.78000000000003">worker 实际原子预留确认</tspan></text><rect x="260" y="470" width="300" height="115" rx="8" fill="#ecf6f0" stroke="#8bb9a0" stroke-width="1.5"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="15.5" fill="#233448" text-anchor="middle"><tspan x="410" y="510.76">lane 0 · 64 项</tspan><tspan x="410" y="532.77">FTL 单生产者</tspan><tspan x="410" y="554.78">submitted / completed / collected</tspan></text><rect x="630" y="470" width="320" height="115" rx="8" fill="#ecf6f0" stroke="#8bb9a0" stroke-width="1.5"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="15.5" fill="#233448" text-anchor="middle"><tspan x="790" y="510.76">DMA worker 0</tspan><tspan x="790" y="532.77">预留槽、复制、链路计时</tspan><tspan x="790" y="554.78">只向 Guest 队列 0、2 发布</tspan></text><rect x="1030" y="470" width="300" height="115" rx="8" fill="#ecf6f0" stroke="#8bb9a0" stroke-width="1.5"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="15.5" fill="#233448" text-anchor="middle"><tspan x="1180" y="510.76">lane 1 · 64 项</tspan><tspan x="1180" y="532.77">FTL 单生产者</tspan><tspan x="1180" y="554.78">submitted / completed / collected</tspan></text><rect x="1400" y="470" width="320" height="115" rx="8" fill="#ecf6f0" stroke="#8bb9a0" stroke-width="1.5"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="15.5" fill="#233448" text-anchor="middle"><tspan x="1560" y="510.76">DMA worker 1</tspan><tspan x="1560" y="532.77">预留槽、复制、链路计时</tspan><tspan x="1560" y="554.78">只向 Guest 队列 1、3 发布</tspan></text><rect x="260" y="790" width="300" height="125" rx="8" fill="#fff6e5" stroke="#ccb47b" stroke-width="1.5"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="15.5" fill="#233448" text-anchor="middle"><tspan x="410" y="824.755">槽组 0 / 就绪队列 0</tspan><tspan x="410" y="846.765">4 个 4MiB + 32 个 64KiB 槽</tspan><tspan x="410" y="868.775">环 37 项，仅传槽号</tspan><tspan x="410" y="890.785">ready / HPCP / DCP 独立状态</tspan></text><rect x="630" y="790" width="300" height="125" rx="8" fill="#fff6e5" stroke="#ccb47b" stroke-width="1.5"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="15.5" fill="#233448" text-anchor="middle"><tspan x="780" y="824.755">槽组 2 / 就绪队列 2</tspan><tspan x="780" y="846.765">4 个 4MiB + 32 个 64KiB 槽</tspan><tspan x="780" y="868.775">环 37 项，仅传槽号</tspan><tspan x="780" y="890.785">ready / HPCP / DCP 独立状态</tspan></text><rect x="1030" y="790" width="300" height="125" rx="8" fill="#fff6e5" stroke="#ccb47b" stroke-width="1.5"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="15.5" fill="#233448" text-anchor="middle"><tspan x="1180" y="824.755">槽组 1 / 就绪队列 1</tspan><tspan x="1180" y="846.765">4 个 4MiB + 32 个 64KiB 槽</tspan><tspan x="1180" y="868.775">环 37 项，仅传槽号</tspan><tspan x="1180" y="890.785">ready / HPCP / DCP 独立状态</tspan></text><rect x="1400" y="790" width="320" height="125" rx="8" fill="#fff6e5" stroke="#ccb47b" stroke-width="1.5"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="15.5" fill="#233448" text-anchor="middle"><tspan x="1560" y="824.755">槽组 3 / 就绪队列 3</tspan><tspan x="1560" y="846.765">4 个 4MiB + 32 个 64KiB 槽</tspan><tspan x="1560" y="868.775">环 37 项，仅传槽号</tspan><tspan x="1560" y="890.785">ready / HPCP / DCP 独立状态</tspan></text><rect x="260" y="1070" width="300" height="80" rx="8" fill="#f3edfa" stroke="#b29ac9" stroke-width="1.5"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="15.5" fill="#233448" text-anchor="middle"><tspan x="410" y="1104.2649999999999">HPCP worker 0</tspan><tspan x="410" y="1126.2749999999999">只消费队列 0 → PUBLISH</tspan></text><rect x="630" y="1070" width="300" height="80" rx="8" fill="#f3edfa" stroke="#b29ac9" stroke-width="1.5"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="15.5" fill="#233448" text-anchor="middle"><tspan x="780" y="1104.2649999999999">HPCP worker 2</tspan><tspan x="780" y="1126.2749999999999">只消费队列 2 → PUBLISH</tspan></text><rect x="1030" y="1070" width="300" height="80" rx="8" fill="#f3edfa" stroke="#b29ac9" stroke-width="1.5"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="15.5" fill="#233448" text-anchor="middle"><tspan x="1180" y="1104.2649999999999">HPCP worker 1</tspan><tspan x="1180" y="1126.2749999999999">只消费队列 1 → PUBLISH</tspan></text><rect x="1400" y="1070" width="320" height="80" rx="8" fill="#f3edfa" stroke="#b29ac9" stroke-width="1.5"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="15.5" fill="#233448" text-anchor="middle"><tspan x="1560" y="1104.2649999999999">HPCP worker 3</tspan><tspan x="1560" y="1126.2749999999999">只消费队列 3 → PUBLISH</tspan></text><rect x="260" y="1290" width="690" height="110" rx="8" fill="#fff6e5" stroke="#ccb47b" stroke-width="1.5"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="15.5" fill="#233448" text-anchor="middle"><tspan x="605" y="1328.26">HPCP · Guest 内核</tspan><tspan x="605" y="1350.27">接收页 → Linux 文件页缓存（4KiB）</tspan><tspan x="605" y="1372.28">已有有效页跳过；缺页按非阻塞准入创建</tspan></text><rect x="1030" y="1290" width="690" height="110" rx="8" fill="#edf4ff" stroke="#91aed1" stroke-width="1.5"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="15.5" fill="#233448" text-anchor="middle"><tspan x="1375" y="1328.26">DCP · 查询 PG 后端</tspan><tspan x="1375" y="1350.27">同一数据区只读 mmap → shared_buffers（8KiB）</tspan><tspan x="1375" y="1372.28">ACQUIRE / RELEASE；不消费 HPCP 槽号队列</tspan></text><rect x="260" y="937" width="1460" height="35" rx="8" fill="#fff6e5" stroke="#ccb47b" stroke-width="1.5"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="15.5" fill="#233448" text-anchor="middle"><tspan x="990" y="959.77">同一个共享接收数据区：DCP 可读取所有槽组，不消耗 HPCP 就绪队列的槽号</tspan></text><rect x="630" y="1490" width="700" height="95" rx="8" fill="#fff6e5" stroke="#ccb47b" stroke-width="1.5"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="15.5" fill="#233448" text-anchor="middle"><tspan x="980" y="1520.76">femu_cache.ko 槽生命周期</tspan><tspan x="980" y="1542.77">所有启用目标完成 → ready = 0 → 归还 Guest 槽</tspan><tspan x="980" y="1564.78">FDM 可在 CU 与实际 DMA 安全结束后更早复用</tspan></text><rect x="424.77" y="708.5" width="110.46" height="23" rx="4" fill="white" opacity=".95"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#28866a" text-anchor="middle"><tspan x="480" y="724.42">DMA + 槽号发布</tspan></text><rect x="1204.77" y="708.5" width="110.46" height="23" rx="4" fill="white" opacity=".95"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#28866a" text-anchor="middle"><tspan x="1260" y="724.42">DMA + 槽号发布</tspan></text><rect x="377" y="983.5" width="66" height="23" rx="4" fill="white" opacity=".95"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#28866a" text-anchor="middle"><tspan x="410" y="999.42">就绪槽号</tspan></text><rect x="747" y="983.5" width="66" height="23" rx="4" fill="white" opacity=".95"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#28866a" text-anchor="middle"><tspan x="780" y="999.42">就绪槽号</tspan></text><rect x="1147" y="983.5" width="66" height="23" rx="4" fill="white" opacity=".95"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#28866a" text-anchor="middle"><tspan x="1180" y="999.42">就绪槽号</tspan></text><rect x="1527" y="983.5" width="66" height="23" rx="4" fill="white" opacity=".95"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#28866a" text-anchor="middle"><tspan x="1560" y="999.42">就绪槽号</tspan></text><rect x="1468.975" y="1209.5" width="142.05" height="23" rx="4" fill="white" opacity=".95"/><text font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#b76a20" text-anchor="middle"><tspan x="1540" y="1225.42">共享接收数据 → DCP</tspan></text><text font-family="Noto Sans CJK SC, sans-serif" font-size="30" fill="#18324c" text-anchor="start" font-weight="700"><tspan x="40" y="57.7">HPCP / DCP · 派发、接收槽与消费者</tspan></text><text font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#425267" text-anchor="start"><tspan x="42" y="93.94">设备队列保存任务引用；Guest 槽保存数据；就绪队列仅传槽号。三者不是同一种缓冲。</tspan></text><text font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#243449" text-anchor="start" font-weight="700"><tspan x="50" y="183.14">设备：FTL</tspan></text><text font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#637185" text-anchor="start"><tspan x="50" y="283.82">单一调度者</tspan><tspan x="50" y="303.7">登记与派发可选填充</tspan></text><text font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#425267" text-anchor="start"><tspan x="1430" y="215">可选填充可丢弃：</tspan><tspan x="1430" y="237.72">设备任务池满、Guest 槽满、</tspan><tspan x="1430" y="260.44">尚未 DMA 的输入将被覆盖。</tspan><tspan x="1430" y="283.15999999999997"></tspan><tspan x="1430" y="305.88">FTL / CU 不等缓存空槽。</tspan></text><text font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#243449" text-anchor="start" font-weight="700"><tspan x="50" y="468.14">设备：DMA</tspan></text><text font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#637185" text-anchor="start"><tspan x="50" y="563.8199999999999">2 条独立后台 worker</tspan><tspan x="50" y="583.6999999999999">完成游标与结果返回 FTL</tspan></text><text font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#425267" text-anchor="start"><tspan x="70" y="1712.6">每 worker 保留 publication FIFO：软件复制与共享 PCIe 链路均完成后，直接发布描述符，无需重新派发。</tspan></text><text font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#236d55" text-anchor="start" font-weight="700"><tspan x="70" y="1775.78">queue = slot % 4；DMA worker = queue % 2。每条就绪队列只有一个设备发布者和一个 Guest HPCP 消费者。</tspan></text><text font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#243449" text-anchor="start" font-weight="700"><tspan x="50" y="778.23">Guest 内核</tspan><tspan x="50" y="808.0500000000001">DMA 接收区</tspan></text><text font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#637185" text-anchor="start"><tspan x="50" y="883.88">固定 DMA 页</tspan><tspan x="50" y="903.76">16 大槽 + 128 小槽</tspan><tspan x="50" y="923.64">72MiB 数据 / 12KiB 描述</tspan></text><text font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#243449" text-anchor="start" font-weight="700"><tspan x="50" y="1078.14">Guest：SNIA 插件</tspan></text><text font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#637185" text-anchor="start"><tspan x="50" y="1143.82">4 条库内 HPCP 线程</tspan><tspan x="50" y="1163.7">不是设备 CU 或 PG worker</tspan></text><text font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#243449" text-anchor="start" font-weight="700"><tspan x="50" y="1298.14">Guest：缓存目标</tspan></text><text font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#637185" text-anchor="start"><tspan x="50" y="1376.32">同一接收数据</tspan><tspan x="50" y="1396.2">两个独立消费者</tspan></text><text font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#425267" text-anchor="start"><tspan x="70" y="1641.5800000000002">一次 DMA，两个目标复制；设备任务记录、FDM 输入、Guest 接收槽分别退还。</tspan><tspan x="70" y="1664.3000000000002">Guest 安装缓存的速度影响后续空槽，但不要求设备保留 FDM 到缓存安装完成。</tspan></text></svg>
