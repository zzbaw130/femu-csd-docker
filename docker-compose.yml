services:
  femu:
    build: .
    image: femu-csd
    devices:
      - /dev/kvm                  # FEMU boots its guest with KVM
    ports:
      - "8080:8080"               # guest SSH, forwarded by run-csd.sh
    ulimits:
      memlock: -1                 # FEMU pins its device memory with mlock
    volumes:
      - ./images:/root/images     # guest image + SSH key, kept on the host
      # ./code holds the container-side build inputs (the FEMU source); it is
      # not shared with the guest. The other four are exported over virtio-9p
      # and appear in the guest as /home/femu/<name>.
      - ./code:/root/workspace/code
      - ./csd:/root/workspace/csd
      - ./scripts:/root/workspace/scripts
      - ./tests:/root/workspace/tests
      - ./results:/root/workspace/results
    stdin_open: true              # -nographic serial console
    tty: true
